<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Votación de Delegado</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <h1>Elección de Delegado</h1>

    <section>
      <button id="btnCargar">Cargar alumnos</button>
      <div id="infoAlumnos" class="box">Alumnos no cargados.</div>
    </section>

    <section>
      <h2>Candidatos</h2>
      <div id="listaCandidatos" class="box">No hay candidatos.</div>
    </section>

    <section>
      <h2>Votar</h2>
      <div id="zonaVoto" class="box">Pulsa “Cargar alumnos” para empezar.</div>
      <div id="estado" class="box small">Votos: 0 / 20</div>
    </section>

    <section>
      <h2>Resultados</h2>
      <div id="resultados" class="box">Aún no hay resultados.</div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
