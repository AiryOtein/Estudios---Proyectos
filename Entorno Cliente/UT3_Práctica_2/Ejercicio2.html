<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ejercicio 2</title>
</head>
<body>
  <h1>Ejercicio 2</h1>
  <button id="atras">Página anterior</button>
  <button id="adelante">Página siguiente</button>

  <script>
    document.getElementById('atras').onclick = function () {
      history.back(); };
    document.getElementById('adelante').onclick = function () {
      history.forward(); };
    
  </script>
</body>
</html>
